{%extends "./base.html" %}
{% block title %}Gestion Reservas{% endblock %}
{%block body%}
<div class="row">
    <div class="col-sm-12 col-md-6 col-lg-4 col-xl-4">
        <h2>Gestion de Reservas</h2>
        <div class="card">
            <div class="card-body">
                <form action="/editarReserva/" method="POST">{%csrf_token%}
                    <div class="form-group">
                        <input type="text" id="txtcodigo" name="txtcodigo" value="{{reserva.codigo}}" class="form-control" placeholder="Codigo"  maxlength="6" required readonly>
                    </div>
                    <div class="form-group">
                        <input type="text" id="txtnombre" name="txtnombre" value="{{reserva.nombre}}" class="form-control" placeholder="Nombre" required>
                    </div>
                    <div class="form-group">
                        <input type="date" id="txtfecha" name="txtfecha" value="{{reserva.fecha}}" class="form-control" placeholder="Fecha" required>
                    </div> 
                    <div class="form-group">
                        <input type="number" id="txthora" name="txthora" value="{{reserva.hora}}" class="form-control" placeholder="Horas" required>
                    </div>
                    <div class="form-group">
                        <input type="number" id="txtpersonas" name="txtpersonas" value="{{reserva.personas}}" class="form-control" placeholder="Personas" required>
                    </div>     


                               

                    <div class="form-group">
                        <button type="submit" class="btn btn-success btn-block text-white">Editar reserva</button>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>
    {%endblock%}
